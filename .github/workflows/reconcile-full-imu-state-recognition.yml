name: Reconcile full IMU state-recognition evidence

on:
  push:
    branches:
      - research/full-imu-state-recognition-20260904
    paths:
      - .github/workflows/reconcile-full-imu-state-recognition.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconcile-full-imu-state-recognition-20260904
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Preserve frozen V0 boundary in code and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_text: str, old: str, new: str) -> None:
              path = Path(path_text)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected source block not found in {path}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "src/putttrack/motion/pickup_v0.py",
              '    baseline_thresholds = detector["stationary_baseline"]\n',
              '    baseline_thresholds = baseline_policy\n',
          )

          replace(
              "tools/imu_state_discovery.py",
              '''def load_v0_config(root: Path) -> dict[str, Any]:
              path = root / "configs" / "research" / "pickup_detector_v0.json"
              payload = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(payload, dict):
                  raise ValueError(f"expected object in {path}")
              return payload
              ''',
              '''def load_v0_config(root: Path) -> dict[str, Any]:
              detector_path = root / "configs" / "research" / "pickup_detector_v0.json"
              profile_path = (
                  root
                  / "configs"
                  / "research"
                  / "pickup_detector_v0_eval_profile.json"
              )
              detector = json.loads(detector_path.read_text(encoding="utf-8"))
              profile = json.loads(profile_path.read_text(encoding="utf-8"))
              if not isinstance(detector, dict) or not isinstance(profile, dict):
                  raise ValueError("expected detector and evaluation-profile objects")
              detector_sha256 = sha256_text(
                  json.dumps(detector, sort_keys=True, separators=(",", ":"))
              )
              expected = str(profile["detector_config_sha256_expected"])
              if detector_sha256 != expected:
                  raise ValueError(
                      f"frozen detector hash mismatch: {detector_sha256} != {expected}"
                  )
              baseline = profile["pre_go_stationary"]
              execution = dict(detector)
              execution["stationary_baseline"] = {
                  "maximum_accel_norm_stdev_mps2": baseline[
                      "maximum_accel_norm_stdev_mps2"
                  ],
                  "maximum_gyro_norm_rms_rads": baseline[
                      "maximum_gyro_norm_rms_rads"
                  ],
              }
              execution["_frozen_config_sha256"] = detector_sha256
              return execution
              ''',
          )

          replace(
              "tools/imu_state_discovery.py",
              '''        "config_sha256": sha256_text(
                  json.dumps(v0_config, sort_keys=True, separators=(",", ":"))
              ),
              ''',
              '''        "config_sha256": v0_config["_frozen_config_sha256"],
              ''',
          )

          replace(
              "tests/test_pickup_v0.py",
              '''        self.assertIn("stationary_baseline", detector)
                      self.assertIn("maximum_accel_norm_stdev_mps2", detector["stationary_baseline"])
                      self.assertIn("maximum_gyro_norm_rms_rads", detector["stationary_baseline"])
              ''',
              '''        self.assertNotIn("stationary_baseline", detector)
                      self.assertIn("pre_go_stationary", profile)
                      self.assertIn(
                          "maximum_accel_norm_stdev_mps2",
                          profile["pre_go_stationary"],
                      )
                      self.assertIn(
                          "maximum_gyro_norm_rms_rads",
                          profile["pre_go_stationary"],
                      )
              ''',
          )

          replace(
              "tools/capture_tag_smp.py",
              '''                print(
                              f"{'\\\\a' if args.audible_cue else ''}GO: action window is "
                              f"{args.episode_seconds:.2f} seconds",
                              file=sys.stderr,
                              flush=True,
                          )
              ''',
              '''                audible_prefix = "\\a" if args.audible_cue else ""
                          print(
                              f"{audible_prefix}GO: action window is "
                              f"{args.episode_seconds:.2f} seconds",
                              file=sys.stderr,
                              flush=True,
                          )
              ''',
          )
          PY

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[research-imu]'

      - name: Regenerate full discovery evidence
        run: |
          python tools/imu_state_discovery.py \
            --repo-root . \
            --output-dir docs/research/imu_state_discovery_20260904
          python tools/render_imu_state_discovery_figures.py \
            docs/research/imu_state_discovery_20260904

      - name: Regenerate frozen V0 raw replay
        env:
          PYTHONPATH: src
        run: |
          python tools/evaluate_pickup_detector.py \
            experiments/research_ball_r1_pickup_precision_1a/manifest.json \
            experiments/research_ball_r1_pickup_precision_1b/manifest.json \
            experiments/research_ball_r1_pickup_precision_1c/manifest.json \
            experiments/research_ball_r1_pickup_precision_1c_drop/manifest.json \
            experiments/research_ball_r1_pickup_precision_1d_gentle/manifest.json \
            experiments/research_ball_r1_pickup_precision_1e_rail/manifest.json \
            experiments/research_ball_r1_pickup_precision_1e_step/manifest.json \
            --output-dir docs/research/imu_analysis_20260904/pickup_v0_holdout_eval

      - name: Validate exact candidate
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_pickup_v0.py' -v
          python -m unittest discover -s tests_research -v
          python tools/verify.py
          git diff --check
          test "$(python - <<'PY'
          import hashlib, json
          from pathlib import Path
          payload = json.loads(Path('configs/research/pickup_detector_v0.json').read_text())
          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          print(hashlib.sha256(canonical).hexdigest())
          PY
          )" = "7add18c4c4a23df0f26674a020f2d0ab78cae7de041467e7db71655aa27b000d"

      - name: Commit generated evidence and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reconcile-full-imu-state-recognition.yml
          git add -A
          git commit -m "research: reconcile full IMU discovery evidence [skip ci]"
          git push origin HEAD:research/full-imu-state-recognition-20260904
