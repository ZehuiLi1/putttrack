name: IMU state discovery research

on:
  push:
    branches:
      - research/imu-state-discovery-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn==1.8.0

      - name: Reconstruct versioned analysis program
        shell: bash
        run: |
          cat analysis_payload/imu_state_discovery.py.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > tools/imu_state_discovery.py
          # NumPy 2.0 removed the deprecated trapz alias.
          sed -i 's/np\.trapz/np.trapezoid/g' tools/imu_state_discovery.py
          # Preserve numeric target dtype in binary LOEO instead of object/unknown.
          sed -i 's/pred = np.empty(len(Y), dtype=object)/pred = np.empty(Y.shape, dtype=Y.dtype)/g' tools/imu_state_discovery.py
          # Dataset-level notes describe known exceptions; they must not make every
          # episode in that manifest invalid or mixed. Gate on episode identity.
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/imu_state_discovery.py')
          source = path.read_text(encoding='utf-8')
          old = '''    reasons: list[str] = []
              p = (ep.capture_path + " " + ep.notes + " " + ep.quality_declared).lower()
              if ".failed" in p or "invalid_label" in p or "diagnostic" in p or not cap.capture_pass or cap.malformed_lines:
                  reasons.append("invalid_or_failed_capture")
                  return "INVALID", reasons
              if len(cap.embedded_labels) > 1 or (cap.embedded_labels and ep.label not in cap.embedded_labels):
                  reasons.append("label_mismatch")
                  return "INVALID", reasons
              if "mixed" in p or "obstacle" in p or "suspected_collision" in p:
                  reasons.append("mixed_or_obstacle_content")
                  return "MIXED", reasons
          '''
          new = '''    reasons: list[str] = []
              evidence_identity = (ep.capture_path + " " + ep.quality_declared).lower()
              episode_identity = (ep.key + " " + ep.capture_path + " " + ep.strength + " " + ep.quality_declared).lower()
              p = ep.notes.lower()
              if ".failed" in evidence_identity or "invalid_label" in evidence_identity or "diagnostic" in evidence_identity or not cap.capture_pass or cap.malformed_lines:
                  reasons.append("invalid_or_failed_capture")
                  return "INVALID", reasons
              if len(cap.embedded_labels) > 1 or (cap.embedded_labels and ep.label not in cap.embedded_labels):
                  reasons.append("label_mismatch")
                  return "INVALID", reasons
              if "mixed" in episode_identity or "plus-obstacle" in episode_identity or "suspected_collision" in episode_identity:
                  reasons.append("mixed_episode_identity")
                  return "MIXED", reasons
          '''
          if old not in source:
              raise SystemExit('semantic-quality patch target not found')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile tools/imu_state_discovery.py

      - name: Run complete episode-level discovery pass
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          python tools/imu_state_discovery.py \
            --root "$GITHUB_WORKSPACE" \
            --out "$GITHUB_WORKSPACE/artifacts/imu_state_discovery_20260904" \
            | tee "$GITHUB_WORKSPACE/artifacts/imu_state_discovery_console.json"

      - name: Upload analysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imu-state-discovery-20260904
          path: artifacts
          if-no-files-found: warn
          retention-days: 30
