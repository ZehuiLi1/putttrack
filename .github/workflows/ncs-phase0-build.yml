name: NCS Phase-0 Source Build

on:
  pull_request:
    paths:
      - "firmware/phase0_cs/**"
      - "scripts/ncs/**"
      - ".github/workflows/ncs-phase0-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ncs-v3-0-2:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout PuttTrack exact head
        uses: actions/checkout@v4

      - name: Pull Nordic v3.0.2 toolchain
        run: docker pull ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.0.2

      - name: Build official RAS samples and PuttTrack telemetry smoke app
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work/putttrack" \
            -w /work/putttrack \
            -e NCS_REV=89ba1294ac9b624e28271a5c71e99193ed4d92a4 \
            -e NCS_MANIFEST_REF=v3.0.2 \
            -e NCS_DIR=/tmp/ncs-v3.0.2 \
            -e OUT_DIR=/work/putttrack/build/ncs-phase0 \
            -e PUTTTRACK_ROOT=/work/putttrack \
            -e BOARD=nrf54l15dk/nrf54l15/cpuapp \
            ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.0.2 \
            bash scripts/ncs/build_phase0_ras.sh

      - name: Summarize boundary
        if: always()
        run: |
          echo "This CI compiles the official Nordic nRF54L15 DK source path."
          echo "It does not prove the vendor Bbo overlay, flashing, RF path, accuracy or hardware stability."
