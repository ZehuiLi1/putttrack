name: NCS Phase-0 Source Build

on:
  pull_request:
    paths:
      - "firmware/phase0_cs/**"
      - "scripts/ncs/**"
      - ".github/workflows/ncs-phase0-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ncs-v3-0-2:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.0.2
    steps:
      - name: Checkout PuttTrack exact head
        uses: actions/checkout@v4

      - name: Build official RAS samples and PuttTrack telemetry smoke app
        env:
          NCS_REV: 89ba1294ac9b624e28271a5c71e99193ed4d92a4
          NCS_DIR: /tmp/ncs-v3.0.2
          OUT_DIR: ${{ github.workspace }}/build/ncs-phase0
          PUTTTRACK_ROOT: ${{ github.workspace }}
          BOARD: nrf54l15dk/nrf54l15/cpuapp
        run: bash scripts/ncs/build_phase0_ras.sh

      - name: Summarize boundary
        if: always()
        run: |
          echo "This CI compiles the official Nordic nRF54L15 DK source path."
          echo "It does not prove the vendor Bbo overlay, flashing, RF path, accuracy or hardware stability."
