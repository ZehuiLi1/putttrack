name: Bootstrap MCU motion Demo V0

on:
  push:
    branches:
      - demo/mcu-motion-state-v0-20260905
    paths:
      - ".github/workflows/bootstrap-mcu-motion-demo-v0.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-mcu-motion-demo-v0
  cancel-in-progress: false

jobs:
  apply-validated-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify candidate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/mcu-motion-demo-v0/part-* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/mcu-motion-demo-v0.patch
          echo "56df937894eb3ac319f097becf73e87e763919ca5831b318e12ddd2fde09ac69  /tmp/mcu-motion-demo-v0.patch" \
            | sha256sum --check --strict
          git apply --index --whitespace=nowarn /tmp/mcu-motion-demo-v0.patch
          git reset HEAD -- .github/workflows/ncs-tag-motion-demo-build.yml
          rm .github/workflows/ncs-tag-motion-demo-build.yml

      - name: Validate source and raw-data replay
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify.py
          python tools/replay_mcu_motion_demo_v0.py \
            --output-dir /tmp/mcu-motion-demo-v0-replay
          diff -u \
            docs/research/mcu_motion_demo_v0_replay_20260905/episode_replay.csv \
            /tmp/mcu-motion-demo-v0-replay/episode_replay.csv
          diff -u \
            docs/research/mcu_motion_demo_v0_replay_20260905/summary.json \
            /tmp/mcu-motion-demo-v0-replay/summary.json

      - name: Publish source candidate and remove bootstrap material
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .bootstrap/mcu-motion-demo-v0
          git rm .github/workflows/bootstrap-mcu-motion-demo-v0.yml
          git add -A
          test -f firmware/nrf54l15_tag_app/src/motion_demo_v0.c
          test -f firmware/nrf54l15_tag_app/src/motion_demo_v0.h
          test -f tools/watch_ball_motion_demo.py
          test -f tools/replay_mcu_motion_demo_v0.py
          test -f scripts/nrf54l15_tag/ci_build_tag_motion_demo.sh
          test ! -e .bootstrap/mcu-motion-demo-v0
          test ! -e .github/workflows/bootstrap-mcu-motion-demo-v0.yml
          test ! -e .github/workflows/ncs-tag-motion-demo-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "demo: add on-ball motion state V0" \
            -m "Port the frozen stationary-start pickup evidence into a bounded on-Ball C state machine, add candidate-only rolling display, encrypted SMP command 24, a live watcher, raw JSONL C replay, tests and documentation. Keep authority=false and leave rolling pickup, impact source, cup, scoring and penalties unsupported."
          git push origin HEAD:demo/mcu-motion-state-v0-20260905
