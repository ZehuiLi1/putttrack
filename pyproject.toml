[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "putttrack"
version = "0.2.0"
description = "PuttTrack smart mini-golf evidence and gameplay foundation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = ["pyarrow>=16"]
research-ml = ["scikit-learn==1.8.0"]
research-imu = ["numpy==2.5.2", "pandas==3.0.5", "scipy==1.18.1", "scikit-learn==1.8.0"]
hardware = ["bleak>=3.0", "pyserial>=3.5", "cbor2>=5.6"]
dev = ["cbor2>=5.6", "bleak>=3.0", "pyarrow>=16", "pyserial>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]
