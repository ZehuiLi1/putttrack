# The Tag has no debug UART selected. Keep this image BLE-only.
CONFIG_UART_MCUMGR=n
CONFIG_MCUMGR_TRANSPORT_UART=n
CONFIG_CONSOLE=n
CONFIG_SHELL=n
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_MCUMGR_TRANSPORT_SHELL=n

# The sample's filesystem commands are not needed for an OTA baseline.
CONFIG_FILE_SYSTEM=n
CONFIG_FILE_SYSTEM_LITTLEFS=n
CONFIG_MCUMGR_GRP_ZBASIC=n
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=n

# Require an encrypted BLE link before exposing SMP read/write access.
# The generic sample has no passkey/OOB callback, so MITM-authenticated access
# would make the management characteristic unusable on this smoke-test image.
CONFIG_BT_SMP=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y
