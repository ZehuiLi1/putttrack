[platformio]
default_envs = airm2m_core_esp32c3

[env:airm2m_core_esp32c3]
platform = platformio/espressif32@6.13.0
board = airm2m_core_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    adafruit/Adafruit PN532@1.3.4
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra
    -Werror=return-type
