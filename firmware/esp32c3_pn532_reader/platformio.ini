[platformio]
default_envs = airm2m_core_esp32c3

[env:airm2m_core_esp32c3]
platform = platformio/espressif32@6.13.0
board = airm2m_core_esp32c3
framework = arduino
extra_scripts = pre:patch_adafruit_pn532.py
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    adafruit/Adafruit PN532@1.3.4
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DPT_PN532_READY_POLL_MS=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra
    -Werror=return-type

# Explicit maintenance build: a host can send an identity-locked migration
# command during the selected Type 4 session. Normal stress builds stay read-only.
[env:nfc_service]
extends = env:airm2m_core_esp32c3
build_flags =
    ${env:airm2m_core_esp32c3.build_flags}
    -DPT_NFC_STRESS_TEST=0
    -DPT_TYPE4_COMMAND_WINDOW_MS=1000
