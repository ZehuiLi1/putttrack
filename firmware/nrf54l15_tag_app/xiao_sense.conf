# Repository-owned PuttTrack Tag firmware: BLE identity/health, raw motion and OTA.

CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.2.7+0"

# MCUboot image management over encrypted BLE SMP.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=8192
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608

# BLE peripheral and secure connections. The lab build uses encrypted Just Works
# pairing; authenticated/MITM access needs a future physical or OOB workflow.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_DEVICE_NAME="PuttTrack-Tag-v0.1"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# XIAO owns one LSM6DS3TR-C via the serialized register backend.
CONFIG_PUTTTRACK_XIAO_SENSE=y
CONFIG_PUTTTRACK_FIRMWARE_VERSION="0.2.7"
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y
CONFIG_LSM6DSL=n
CONFIG_PM_DEVICE=y
CONFIG_ADC=y
CONFIG_FUEL_GAUGE=y
CONFIG_FUEL_GAUGE_COMPOSITE=y

# Stable hardware identity, boot identity and reset diagnostics.
CONFIG_HWINFO=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_REBOOT=y

# The Tag has no selected debug UART. Runtime diagnostics are part of the BLE
# status record rather than an inaccessible console.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_MCUMGR=n
CONFIG_MCUMGR_TRANSPORT_UART=n
CONFIG_SHELL=n
CONFIG_LOG=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# NFC Type 4 read/write service and an explicit, recoverable System OFF experiment.
CONFIG_PUTTTRACK_NFC_SERVICE=y
CONFIG_NFC_T4T_NRFXLIB=y
CONFIG_NFC_NDEF=y
CONFIG_NFC_NDEF_MSG=y
CONFIG_NFC_NDEF_RECORD=y
CONFIG_NFC_NDEF_URI_REC=y
CONFIG_NFC_NDEF_URI_MSG=y
CONFIG_PUTTTRACK_NFC_SYSTEM_OFF_TEST=y
CONFIG_POWEROFF=y

# Preserve BLE identity and pairing keys across MCUboot trial/rollback/reset.
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_PUTTTRACK_NFC_READ_LED=y
